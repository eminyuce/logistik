<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" fill="none" stroke="#D6E6F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Büyük konteyner gemisi çizimi">
