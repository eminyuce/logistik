<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" fill="none" stroke="#E8921D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="American Class-8 semi-truck technical line illustration">
